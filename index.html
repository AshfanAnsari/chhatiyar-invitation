<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>You're Invited — Chhatiyar of Mohammad Asad</title>
<meta name="description" content="With the blessings of Almighty Allah, the Ahmed family invites you to the Chhatiyar Ceremony of Mohammad Asad — Wednesday, 28 October 2026, 6:00 PM onwards, at our home.">
<meta property="og:title" content="You're Invited — Chhatiyar of Mohammad Asad">
<meta property="og:description" content="Wednesday, 28 October 2026 · 6:00 PM onwards · At Our Home. Tap to open your invitation.">
<meta property="og:type" content="website">
<meta property="og:image" content="invitation-card.png">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Jost:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF8F1; --char:#3A3128; --char-soft:#5C5344;
    --gold:#A87F33; --gold-deep:#7A5C2E; --gold-faint:rgba(168,127,51,.3);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Jost',sans-serif;color:var(--char);overflow:hidden;background:#14100B}
  .stage{position:relative;height:100dvh;overflow:hidden}
  video.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,11,.18) 0%,rgba(20,16,11,0) 22%,rgba(20,16,11,0) 62%,rgba(20,16,11,.38) 100%);pointer-events:none}
  /* skip */
  .skip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:6;
    background:rgba(251,248,241,.85);backdrop-filter:blur(6px);border:1px solid var(--gold-faint);border-radius:999px;
    font-family:'Jost',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--char);
    padding:9px 16px 9px 19px;cursor:pointer;opacity:0;transition:opacity .8s ease}
  .skip.show{opacity:1}
  /* persistent soft pill */
  .pill{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;
    display:inline-block;text-decoration:none;background:rgba(251,248,241,.88);backdrop-filter:blur(8px);
    border:1px solid var(--gold-faint);border-radius:999px;color:var(--gold-deep);
    font-size:11.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;padding:13px 26px 13px 29px;
    box-shadow:0 14px 34px rgba(20,16,11,.35);opacity:0;transition:opacity .8s ease;white-space:nowrap}
  .pill.show{opacity:1}
  /* play button (reduced-motion / autoplay blocked) */
  .play{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(20,16,11,.25)}
  .play.show{display:flex}
  .play button{width:84px;height:84px;border-radius:50%;border:1px solid rgba(251,248,241,.7);cursor:pointer;
    background:rgba(251,248,241,.9);color:var(--gold-deep);font-size:30px;padding-left:6px;box-shadow:0 18px 44px rgba(20,16,11,.4)}
  /* end card */
  .endcard{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:22px;
    opacity:0;pointer-events:none;transition:opacity .9s ease;background:rgba(24,19,13,.28);backdrop-filter:blur(2px)}
  .endcard.show{opacity:1;pointer-events:auto}
  .card{width:min(420px,100%);background:rgba(251,248,241,.94);border:1px solid var(--gold-faint);
    border-radius:150px 150px 8px 8px;padding:46px 30px 30px;text-align:center;box-shadow:0 34px 80px rgba(20,16,11,.45)}
  .forline{font-size:10px;font-weight:500;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-deep)}
  .script{font-family:'Great Vibes',cursive;font-size:54px;color:var(--gold);line-height:1.1;margin-top:8px}
  .name{font-family:'Fraunces',serif;font-weight:500;font-size:27px;letter-spacing:.14em;margin-top:10px;line-height:1.3}
  .details{font-size:11.5px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--char-soft);line-height:2.05;margin-top:12px}
  .details span{color:var(--gold-deep)}
  .count{display:flex;justify-content:center;margin-top:16px;border-top:1px solid var(--gold-faint);border-bottom:1px solid var(--gold-faint)}
  .count div{padding:8px 12px 6px;min-width:56px}
  .count div+div{border-left:1px solid var(--gold-faint)}
  .count b{display:block;font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
  .count span{display:block;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);margin-top:4px}
  .cta{display:inline-block;margin-top:20px;text-decoration:none;background:linear-gradient(180deg,#BE9A4E,#A87F33);
    color:#FFF9EA;border:1px solid #96762C;border-radius:999px;padding:14px 30px;font-size:12px;font-weight:500;
    letter-spacing:.3em;text-transform:uppercase;box-shadow:0 12px 28px rgba(122,92,46,.32)}
  .again{display:block;margin:15px auto 0;background:none;border:none;cursor:pointer;font-family:'Jost',sans-serif;
    font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--char-soft)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<div class="stage">
  <video class="hero" id="vid" autoplay muted playsinline preload="auto" poster="poster.jpg">
    <source src="chhatiyar-video.mp4" type="video/mp4">
  </video>
  <div class="shade"></div>

  <button class="skip" id="skipBtn" type="button">Skip ▸</button>
  <a class="pill" id="pill" href="invitation.html">Open Your Invitation</a>

  <div class="play" id="playWrap"><button id="playBtn" type="button" aria-label="Play the invitation video">▶</button></div>

  <section class="endcard" id="endcard" aria-hidden="true">
    <div class="card">
      <div class="forline" id="forLine" hidden></div>
      <div class="script">Chhatiyar</div>
      <h1 class="name">MOHAMMAD ASAD</h1>
      <p class="details">Wednesday 28th October<br><span>6:00 PM Onwards</span><br>At Our Home</p>
      <div class="count" role="timer" aria-label="Countdown to the celebration">
        <div><b id="cd-d">--</b><span>Days</span></div>
        <div><b id="cd-h">--</b><span>Hours</span></div>
        <div><b id="cd-m">--</b><span>Mins</span></div>
        <div><b id="cd-s">--</b><span>Secs</span></div>
      </div>
      <a class="cta" id="cta" href="invitation.html">Open the Invitation</a>
      <button class="again" id="againBtn" type="button">↻ Watch the video again</button>
    </div>
  </section>
</div>

<script>
  var vid = document.getElementById('vid');
  var endcard = document.getElementById('endcard');
  var skipBtn = document.getElementById('skipBtn'), pill = document.getElementById('pill');
  var playWrap = document.getElementById('playWrap');
  var cardShown = false;

  function showCard() {
    if (cardShown) return; cardShown = true;
    endcard.classList.add('show'); endcard.setAttribute('aria-hidden', 'false');
    skipBtn.classList.remove('show'); pill.classList.remove('show');
  }
  function hideCard() {
    cardShown = false;
    endcard.classList.remove('show'); endcard.setAttribute('aria-hidden', 'true');
    skipBtn.classList.add('show'); pill.classList.add('show');
  }
  vid.addEventListener('ended', showCard);
  setTimeout(function () { if (!cardShown && !vid.paused) { skipBtn.classList.add('show'); pill.classList.add('show'); } }, 2000);
  setTimeout(showCard, 34000); /* safety: if 'ended' never fires */
  skipBtn.addEventListener('click', function () { try { vid.pause(); } catch (e) {} showCard(); });
  document.getElementById('againBtn').addEventListener('click', function () {
    hideCard();
    try { vid.currentTime = 0; vid.play(); } catch (e) {}
  });
  /* if autoplay is blocked or reduced motion, offer a play button instead */
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function armPlayButton() { playWrap.classList.add('show'); }
  if (reduced) { try { vid.pause(); vid.removeAttribute('autoplay'); } catch (e) {} armPlayButton(); }
  else {
    var pr = vid.play();
    if (pr && pr.catch) pr.catch(armPlayButton);
    setTimeout(function () { if (vid.paused && !cardShown) armPlayButton(); }, 1800);
  }
  document.getElementById('playBtn').addEventListener('click', function () {
    playWrap.classList.remove('show');
    vid.play();
    setTimeout(function () { if (!cardShown) { skipBtn.classList.add('show'); pill.classList.add('show'); } }, 600);
  });

  /* personal greeting + pass the name through */
  try {
    var g = new URLSearchParams(location.search).get('to');
    if (g) {
      var clean = g.replace(/\s+/g, ' ').trim().slice(0, 42);
      if (clean) {
        var fl = document.getElementById('forLine');
        fl.textContent = 'Prepared for ' + clean;
        fl.hidden = false;
        var href = 'invitation.html?to=' + encodeURIComponent(clean);
        document.getElementById('cta').href = href;
        pill.href = href;
      }
    }
  } catch (e) {}

  /* countdown */
  var target = new Date('2026-10-28T18:00:00+05:30').getTime();
  var cd = { d: document.getElementById('cd-d'), h: document.getElementById('cd-h'), m: document.getElementById('cd-m'), s: document.getElementById('cd-s') };
  function tick() {
    var diff = target - Date.now();
    if (diff <= 0) { cd.d.textContent = cd.h.textContent = cd.m.textContent = cd.s.textContent = '00'; return; }
    cd.d.textContent = String(Math.floor(diff / 864e5)).padStart(2, '0');
    cd.h.textContent = String(Math.floor(diff / 36e5) % 24).padStart(2, '0');
    cd.m.textContent = String(Math.floor(diff / 6e4) % 60).padStart(2, '0');
    cd.s.textContent = String(Math.floor(diff / 1e3) % 60).padStart(2, '0');
    setTimeout(tick, 1000);
  }
  tick();
</script>
</body>
</html>
